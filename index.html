<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<title>The Luxe Store</title>

<style>

body{
margin:0;
padding:0;
opacity:0;
transition:1s;
background:black;
font-family:'Poppins',sans-serif;
color:white;
 scroll-behavior:smooth; 
 background-image:radial-gradient(#222 1px, transparent 1px);
background-size:40px 40px;
 animation:fadeIn 1.5s ease;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(17,17,17,0.6);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
position:sticky;
top:0;
z-index:999;
 backdrop-filter:blur(10px);
background:rgba(0,0,0,0.5);
}
  position:sticky;
top:0;
z-index:1000;

.logo{
font-size:32px;
font-weight:bold;
color:gold;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(to bottom, #000, #111);
}

.hero h1{
font-size:70px;
color:gold;
margin:0;
  animation:glow 2s infinite alternate;
 text-shadow:0 0 20px gold;
}

.hero p{
font-size:22px;
margin-top:10px;
 text-shadow:0 0 10px rgba(255,215,0,0.5);
}

.btn{
padding:15px 35px;
background:gold;
color:black;
border:none;
font-size:18px;
cursor:pointer;
margin-top:20px;
border-radius:5px;
 transition:0.3s;
box-shadow:0 0 15px rgba(255,215,0,0.3);
}
 .btn:hover{
transform:scale(1.08);
box-shadow:0 0 20px gold;
}
.btn:hover{
background:white;
color:black;
}
.products{
padding:50px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
  transition:0.3s;  
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(255,215,0,0.1);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
  display:block;
 transition:0.4s;
}
.card:hover{
transform:translateY(-15px) scale(1.05) rotateX(5deg);
box-shadow:0 0 25px gold;
}
 .card:hover img{
transform:scale(1.08);
}

.card h2{
color:gold;
}

.price{
font-size:20px;
margin:10px 0;
}

footer{
text-align:center;
padding:20px;
background:#111;
margin-top:50px;
}
@keyframes glow{
from{
text-shadow:0 0 10px gold;
}
to{
text-shadow:0 0 25px orange;
}
}
}
@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}
  .social-icons{
margin-top:15px;
}

.social-icons a{
color:gold;
text-decoration:none;
margin:0 10px;
font-size:18px;
transition:0.3s;
}

.social-icons a:hover{
color:white;
}
 @media(max-width:768px){

.hero h1{
font-size:40px;
}

.products{
grid-template-columns:1fr;
padding:20px;
}

header{
flex-direction:column;
gap:15px;
}

nav{
display:flex;
gap:15px;
}

}
 .popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:1000;
}

.popup-content{
background:#111;
padding:30px;
border-radius:15px;
text-align:center;
width:300px;
box-shadow:0 0 20px gold;
}

.popup-content h2{
color:gold;
}

.popup-content p{
font-size:20px;
margin:15px 0;
}
 .cart-sidebar{
position:fixed;
right:-400px;
top:0;
width:320px;
height:100%;
background:#111;
padding:20px;
box-shadow:-5px 0 20px rgba(255,215,0,0.3);
transition:0.4s;
z-index:2000;
overflow-y:auto;
}
.bump{

transform: scale(1.3);

transition: 0.3s;

color: yellow;

}
.cart-sidebar.active{
right:0;
}

.cart-sidebar h2,
.cart-sidebar h3{
color:gold;
}

.cart-item{
margin:15px 0;
padding:10px;
border-bottom:1px solid #333;
}
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:5000;
}

#loader h1{
color:gold;
font-size:50px;
animation:glow 1s infinite alternate;
} 
</style>
</head>

<body>

<header>

<div class="logo">THE LUXE STORE</div>
  <div style="color:gold; font-size:20px;">
🛒 Cart: <span id="cart-count">0</span>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>LUXURY COLLECTION</h1>

<p>Premium Fashion & Accessories</p>

<button class="btn" onclick="document.querySelector('.products').scrollIntoView({behavior:'smooth'})">
Shop Now
</button>
</section>
<input 
type="text" 
id="search" 
placeholder="Search products..."
onkeyup="searchProducts()"
style="width:80%;padding:12px;margin:20px;border-radius:10px;border:none;font-size:16px;"
>

<section class="products" id="products">

<div class="card">

<img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49">

<h2>Luxury Watch</h2>

<div class="price">$299</div>

<button class="btn" onclick="addToCart('Luxury Watch',299)">Buy Now</button>
</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

<h2>Premium Shoes</h2>

<div class="price">$199</div>

<button class="btn" onclick="addToCart('Premium Shoes',199)">Buy Now</button>
</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">

<h2>Designer Shirt</h2>

<div class="price">$149</div>

<button class="btn" onclick="addToCart('Designer Shirt',149)">Buy Now</button>
</div>

</section>

<footer>

© 2026 THE LUXE STORE

<div class="social-icons">
<a href="#">Instagram</a>
<a href="#">Facebook</a>
<a href="#">Twitter</a>
</div>

</footer>

<script>
  
let cart = 0;
 let cartTotal = 0;
let cartItems = document.getElementById("cart-items");
let savedCart = localStorage.getItem("cartCount");

if(savedCart){
cart = parseInt(savedCart);
document.getElementById("cart-count").innerText = cart;
}
function addToCart(product,price){

cart++;
localStorage.setItem("cartCount", cart);
document.getElementById("cart-count").innerText = cart;
let cartCount = document.getElementById("cart-count");

cartCount.classList.add("bump");

setTimeout(() => {

cartCount.classList.remove("bump");

},300);
document.getElementById("popup").style.display = "flex";

document.getElementById("popup-title").innerText = product;

document.getElementById("popup-price").innerText = "Added to cart successfully!";
 cartTotal += price;
document.getElementById("cart-total").innerText = cartTotal;

cartItems.innerHTML += `
<div style="margin:10px 0;padding:10px;background:#222;border-radius:10px;">
${product} - $$(price)
<button onclick="
cart--;
document.getElementById('cart-count').innerText = cart;
cartTotal -= price;
document.getElementById('cart-total').innerText = cartTotal;
this.parentElement.remove();
"
style="margin-top:8px;padding:5px 10px;background:red;color:white;border:none;border-radius:5px;cursor:pointer;">
Remove
</button>
</div>
`;
}
 function closePopup(){
document.getElementById("popup").style.display = "none";
  openCart();
}
 function openCart(){
document.getElementById("cart-sidebar").classList.add("active");
}

function closeCart(){
document.getElementById("cart-sidebar").classList.remove("active");
}
function checkoutWhatsApp(){

let message = "New Order:%0A";

message += "Items in Cart: " + cart + "%0A";

message += "Total: $" + cartTotal;

window.open("https://wa.me/923009599999?text=" + message);

}
 function searchProducts(){

let input = document.getElementById("search").value.toLowerCase();

let cards = document.querySelectorAll(".card");

cards.forEach(card => {

let title = card.querySelector("h2").innerText.toLowerCase();

if(title.includes(input)){

card.style.display = "block";

}else{

card.style.display = "none";

}

});

}
</script>
 <div id="popup" class="popup">

<div class="popup-content">

<h2 id="popup-title"></h2>

<p id="popup-price"></p>

<button class="btn" onclick="closePopup()">Close</button>
<button class="btn" onclick="checkoutWhatsApp()">
Order on WhatsApp
</button>
</div>

</div>
 <div id="cart-sidebar" class="cart-sidebar">
<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3>Total: $<span id="cart-total">0</span></h3>

<button class="btn" onclick="closeCart()">Close</button>
</div>
<div id="loader">
<h1>THE LUXE STORE</h1>
</div>
 <script>
window.onload = function(){
setTimeout(function(){
document.getElementById("loader").style.display = "none";
},2000);
}
</script>
 <script>
window.onload = function(){
document.body.style.opacity = "1";
}
</script>
</body>
</html>
