<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<title>The Luxe Store</title>

<style>

body{
margin:0;
padding:0;
background:black;
font-family:'Poppins',sans-serif;
color:white;
 scroll-behavior:smooth; 
 background-image:radial-gradient(#222 1px, transparent 1px);
background-size:40px 40px;
 animation:fadeIn 1.5s ease;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(17,17,17,0.6);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
position:sticky;
top:0;
z-index:999;
 backdrop-filter:blur(10px);
background:rgba(0,0,0,0.5);
}
  position:sticky;
top:0;
z-index:1000;

.logo{
font-size:32px;
font-weight:bold;
color:gold;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(to bottom, #000, #111);
}

.hero h1{
font-size:70px;
color:gold;
margin:0;
  animation:glow 2s infinite alternate;
}

.hero p{
font-size:22px;
margin-top:10px;
}

.btn{
padding:15px 35px;
background:gold;
color:black;
border:none;
font-size:18px;
cursor:pointer;
margin-top:20px;
border-radius:5px;
 transition:0.3s;
}
 .btn:hover{
transform:scale(1.08);
box-shadow:0 0 20px gold;
}
.btn:hover{
background:white;
color:black;
}
.products{
padding:50px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
  transition:0.3s;  

}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
  display:block;
}
.card:hover{
transform:scale(1.05);
}
.card h2{
color:gold;
}

.price{
font-size:20px;
margin:10px 0;
}

footer{
text-align:center;
padding:20px;
background:#111;
margin-top:50px;
}
@keyframes glow{
from{
text-shadow:0 0 10px gold;
}
to{
text-shadow:0 0 25px orange;
}
}
}
@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}
  .social-icons{
margin-top:15px;
}

.social-icons a{
color:gold;
text-decoration:none;
margin:0 10px;
font-size:18px;
transition:0.3s;
}

.social-icons a:hover{
color:white;
}
 @media(max-width:768px){

.hero h1{
font-size:40px;
}

.products{
grid-template-columns:1fr;
padding:20px;
}

header{
flex-direction:column;
gap:15px;
}

nav{
display:flex;
gap:15px;
}

}
 .popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:1000;
}

.popup-content{
background:#111;
padding:30px;
border-radius:15px;
text-align:center;
width:300px;
box-shadow:0 0 20px gold;
}

.popup-content h2{
color:gold;
}

.popup-content p{
font-size:20px;
margin:15px 0;
}
</style>
</head>

<body>

<header>

<div class="logo">THE LUXE STORE</div>
  <div style="color:gold; font-size:20px;">
🛒 Cart: <span id="cart-count">0</span>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>LUXURY COLLECTION</h1>

<p>Premium Fashion & Accessories</p>

<button class="btn" onclick="document.querySelector('.products').scrollIntoView({behavior:'smooth'})">
Shop Now
</button>
</section>

<section class="products" id="products">

<div class="card">

<img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49">

<h2>Luxury Watch</h2>

<div class="price">$299</div>

<button class="btn" onclick="addToCart('Luxury Watch')">Buy Now</button>
</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

<h2>Premium Shoes</h2>

<div class="price">$199</div>

<button class="btn" onclick="addToCart('Premium Shoes')">Buy Now</button>
</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">

<h2>Designer Shirt</h2>

<div class="price">$149</div>

<button class="btn" onclick="addToCart('Designer Shirt')">Buy Now</button>
</div>

</section>

<footer>

© 2026 THE LUXE STORE

<div class="social-icons">
<a href="#">Instagram</a>
<a href="#">Facebook</a>
<a href="#">Twitter</a>
</div>

</footer>

<script>
  
let cart = 0;

function addToCart(product){

cart++;

document.getElementById("cart-count").innerText = cart;

document.getElementById("popup").style.display = "flex";

document.getElementById("popup-title").innerText = product;

document.getElementById("popup-price").innerText = "Added to cart successfully!";
}
 function closePopup(){
document.getElementById("popup").style.display = "none";
}
</script>
 <div id="popup" class="popup">

<div class="popup-content">

<h2 id="popup-title"></h2>

<p id="popup-price"></p>

<button class="btn" onclick="closePopup()">Close</button>

</div>

</div>
</body>
</html>
